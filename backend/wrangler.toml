name = "melochi4luna-library"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cơ sở dữ liệu D1 (nhất quán ngay lập tức). Tạo bằng:  wrangler d1 create melochi4luna
# rồi dán database_id vào đây, và chạy:  wrangler d1 execute melochi4luna --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "melochi4luna"
database_id = "PASTE_D1_DATABASE_ID_HERE"

# Khoá API đặt bằng secret, không ghi vào file:
#   wrangler secret put COHERE_API_KEY
#   wrangler secret put ADMIN_USERS
# [vars]
# COHERE_MODEL = "command-r7b-12-2024"
